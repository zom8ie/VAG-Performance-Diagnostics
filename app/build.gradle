plugins {
    id 'com.android.application' version '8.11.1'
}

layout.buildDirectory.set(rootProject.layout.buildDirectory.dir('android'))

android {
    namespace 'ru.yeti.diag'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        minSdk 31
        targetSdk 36
    }

    buildTypes {
        debug {
            // A separate package prevents the Desktop Head Unit test app from
            // replacing the phone build.
            applicationIdSuffix '.dhu'
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    implementation 'androidx.core:core:1.13.1'
}
